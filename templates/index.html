<!DOCTYPE html>
<html>
<head><title>LangDB CSV Query</title></head>
<body>
  <h2>Upload CSV</h2>
  <form action="/" method="post" enctype="multipart/form-data">
    <input type="file" name="csvfile" required>
    <input type="submit" value="Upload">
  </form>

  <hr>

  <h2>Ask a Question</h2>
  <form onsubmit="submitQuestion(event)">
    <input type="text" id="question" placeholder="e.g. What was the total revenue in March?" required>
    <button type="submit">Ask</button>
  </form>

  <pre id="result"></pre>

  <script>
    async function submitQuestion(e) {
      e.preventDefault();
      const question = document.getElementById('question').value;
      const response = await fetch('/ask', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: `question=${encodeURIComponent(question)}`
      });
      const data = await response.json();
      if (data.error) {
        document.getElementById('result').textContent = "❌ Error: " + data.error;
      } else {
        document.getElementById('result').textContent =
          "🧠 SQL:\n" + data.sql + "\n\n📊 Result:\n" + JSON.stringify(data.result, null, 2);
      }
    }
  </script>
</body>
</html>
